[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-agents"
version = "0.1.0"
description = "Agentic demand forecasting and inventory optimization (capstone project)"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "statsmodels",
  "pyyaml",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50", "plotly"]
llm = ["anthropic"]
lightgbm = ["lightgbm"]
report = ["matplotlib"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
