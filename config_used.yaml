project:
  seed: 42
data:
  source: synthetic
  frequency: D
  season_period: 7
  target_type: count
  extra_features: []
  synthetic:
    n_stores: 3
    n_items: 12
    n_days: 1000
    start_date: '2021-01-01'
    shocks: true
  m5:
    raw_dir: data/raw/m5
    n_stores: 3
    n_items: 50
    max_days: 1000
  walmart:
    path: data/raw/walmart/Walmart.csv
  noaa:
    path: null
split:
  test_days: 56
  val_days: 84
forecast:
  horizon: 7
  lags:
  - 7
  - 14
  - 21
  - 28
  rolling_windows:
  - 7
  - 28
  selection:
    blend_with_ets: true
    min_relative_gain: 0.02
  model:
    type: hist_gbm
    params:
      max_iter: 300
      learning_rate: 0.05
      max_leaf_nodes: 31
      loss: poisson
  baselines:
  - seasonal_naive
  - ets
  arima_order:
  - 7
  - 0
  - 0
  classical_window: 365
  price_window: 56
uncertainty:
  nominal_coverage: 0.9
  check_days: 28
  psum_inflation: true
  max_psum_inflation: 2.0
  adaptive:
    enabled: true
    gamma: 0.15
    max_log_scale: 0.7
    use_in_planner: false
critic:
  coverage_tolerance: 0.05
  max_revision_rounds: 2
  max_interval_scale: 2.0
  weather_z_threshold: 2.0
  drift_window_days: 14
  drift_ratio_threshold: 1.5
  pool_sensitivity_by: item
  learn_weights: true
  prior_strength: 100
  sensitivity_t_threshold: 3.0
  risk_weights:
    event: 0.25
    weather: 0.35
    drift: 1.25
    price: 0.2
  price_quantile: 0.01
  max_risk_multiplier: 2.5
inventory:
  lead_time_days: 2
  review_period_days: 1
  service_level: 0.95
  holding_rate_annual: 0.25
  stockout_cost_frac_of_price: 0.5
  unit_label: units
  lead_time_delay_prob: 0.0
  lead_time_delay_max: 0
  lead_time_buffer: 0
  batch_size: 1
  min_order_qty: 0
  fixed_order_cost: 0.0
  order_rule: base_stock
  s_S_gap_periods: 2
  abc_service_levels:
    enabled: false
    A: 0.98
    B: 0.95
    C: 0.9
  nowcast:
    enabled: true
    window: 7
    z_threshold: 3.0
    shrink: 0.7
    clip:
    - 0.8
    - 2.0
llm:
  enabled: false
  model: claude-sonnet-5-5
output_dir: outputs/latest
